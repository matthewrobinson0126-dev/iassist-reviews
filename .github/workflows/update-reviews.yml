name: Update Google reviews

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 06:00 South Africa time
  workflow_dispatch:       # "Run workflow" button for a manual check

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rating and review count
        id: fetch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_reviews.py
        continue-on-error: true
      - name: Save reviews.json
        run: |
          git config user.name "iassist-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reviews.json
          git commit -m "Daily Google reviews check" || echo "No change"
          git push
      - name: Report a failed check
        if: steps.fetch.outcome == 'failure'
        run: exit 1
